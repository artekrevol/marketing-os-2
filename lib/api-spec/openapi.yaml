openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification — SEO OS Sprint 2 admin/system surface.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-system
    description: Admin-only worker/queue observability and triggers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/system/heartbeat:
    post:
      operationId: triggerHeartbeat
      tags: [admin-system]
      summary: Enqueue a worker heartbeat
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/test-dataforseo:
    post:
      operationId: triggerDataForSeoTest
      tags: [admin-system]
      summary: Enqueue a DataForSEO SERP smoke test
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/test-originality:
    post:
      operationId: triggerOriginalityTest
      tags: [admin-system]
      summary: Enqueue an Originality.ai scan smoke test
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/queues:
    get:
      operationId: getQueueDepths
      tags: [admin-system]
      summary: Live BullMQ queue counts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue depths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDepths"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/events:
    get:
      operationId: getRecentEvents
      tags: [admin-system]
      summary: Recent events (limit 20)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/system/heartbeat-freshness:
    get:
      operationId: getHeartbeatFreshness
      tags: [admin-system]
      summary: Most recent system.heartbeat event age
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatFreshness"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/system/dead-jobs:
    get:
      operationId: getDeadJobs
      tags: [admin-system]
      summary: Last 20 dead-letter rows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadJobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not an admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QueueUnavailable:
      description: BullMQ / Redis unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    EnqueueResult:
      type: object
      properties:
        jobId:
          type: string
        queueName:
          type: string
        idempotencyKey:
          type: string
      required:
        - jobId
        - queueName
        - idempotencyKey
    QueueCounts:
      type: object
      properties:
        name:
          type: string
        wait:
          type: integer
        active:
          type: integer
        delayed:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        paused:
          type: integer
      required:
        - name
        - wait
        - active
        - delayed
        - completed
        - failed
        - paused
    QueueDepths:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueCounts"
      required:
        - queues
    EventRow:
      type: object
      properties:
        id:
          type: string
        brandId:
          type: string
          nullable: true
        actorId:
          type: string
          nullable: true
        eventType:
          type: string
        subjectType:
          type: string
          nullable: true
        subjectId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - payload
        - createdAt
    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventRow"
      required:
        - events
    HeartbeatFreshness:
      type: object
      properties:
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        ageSeconds:
          type: integer
          nullable: true
        payload:
          type: object
          additionalProperties: true
      required:
        - lastEventAt
        - ageSeconds
    DeadJobRow:
      type: object
      properties:
        id:
          type: string
        queueName:
          type: string
        jobName:
          type: string
        jobId:
          type: string
        payload:
          type: object
          additionalProperties: true
        failureReason:
          type: string
        attemptsMade:
          type: integer
        failedAt:
          type: string
          format: date-time
      required:
        - id
        - queueName
        - jobName
        - jobId
        - failureReason
        - attemptsMade
        - failedAt
    DeadJobList:
      type: object
      properties:
        deadJobs:
          type: array
          items:
            $ref: "#/components/schemas/DeadJobRow"
      required:
        - deadJobs
