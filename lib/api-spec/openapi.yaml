openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification — SEO OS Sprint 2 admin/system surface.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-system
    description: Admin-only worker/queue observability and triggers
  - name: quality-gate
    description: Sprint 3 reviewer queue, automated checks, sign-off transitions
  - name: recovery
    description: Sprint 4 Recovery War Room — baseline, snapshots, initiatives
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /admin/system/heartbeat:
    post:
      operationId: triggerHeartbeat
      tags: [admin-system]
      summary: Enqueue a worker heartbeat
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/test-dataforseo:
    post:
      operationId: triggerDataForSeoTest
      tags: [admin-system]
      summary: Enqueue a DataForSEO SERP smoke test
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/test-originality:
    post:
      operationId: triggerOriginalityTest
      tags: [admin-system]
      summary: Enqueue an Originality.ai scan smoke test
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/queues:
    get:
      operationId: getQueueDepths
      tags: [admin-system]
      summary: Live BullMQ queue counts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Queue depths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDepths"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/QueueUnavailable"
  /admin/system/events:
    get:
      operationId: getRecentEvents
      tags: [admin-system]
      summary: Recent events (limit 20)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/system/heartbeat-freshness:
    get:
      operationId: getHeartbeatFreshness
      tags: [admin-system]
      summary: Most recent system.heartbeat event age
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatFreshness"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/system/dead-jobs:
    get:
      operationId: getDeadJobs
      tags: [admin-system]
      summary: Last 20 dead-letter rows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadJobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quality-gate/submit:
    post:
      operationId: qualityGateSubmit
      tags: [quality-gate]
      summary: Submit a content_object for review (kicks off a qa_run)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateSubmitRequest"
      responses:
        "202":
          description: Accepted — qa_run enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateSubmitResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: content_object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quality-gate/decide:
    post:
      operationId: qualityGateDecide
      tags: [quality-gate]
      summary: Reviewer approves or rejects a content_object
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateDecideRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateDecisionResult"
        "400":
          description: Bad request (e.g. missing comment on rejection)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: content_object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /quality-gate/queue:
    get:
      operationId: qualityGateQueue
      tags: [quality-gate]
      summary: List submitted/in-review content_objects for a brand
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: brandId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateQueueList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quality-gate/review:
    get:
      operationId: qualityGateReviewDetail
      tags: [quality-gate]
      summary: Full review surface for a single content_object
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: contentObjectId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: brandId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateReviewDetailBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recovery/overview/{brandId}:
    get:
      operationId: getRecoveryOverview
      tags: [recovery]
      summary: Recovery overview payload for the dashboard headline card
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryOverviewBody"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recovery/snapshots/{brandId}:
    get:
      operationId: getRecoverySnapshots
      tags: [recovery]
      summary: Recovery snapshots within a trailing window (default 90 days)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 730
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySnapshotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recovery/initiatives/{brandId}:
    get:
      operationId: getRecoveryInitiatives
      tags: [recovery]
      summary: List recovery initiatives for a brand
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: brandId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryInitiativeList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /quality-gate/start-from-draft:
    post:
      operationId: qualityGateStartFromDraft
      tags: [quality-gate]
      summary: Create-or-find a content_object from a project's latest draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateStartFromDraftRequest"
      responses:
        "200":
          description: Reused existing content_object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateStartFromDraftResult"
        "201":
          description: Created new content_object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGateStartFromDraftResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No draft found for project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated but not an admin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    QueueUnavailable:
      description: BullMQ / Redis unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    EnqueueResult:
      type: object
      properties:
        jobId:
          type: string
        queueName:
          type: string
        idempotencyKey:
          type: string
      required:
        - jobId
        - queueName
        - idempotencyKey
    QueueCounts:
      type: object
      properties:
        name:
          type: string
        wait:
          type: integer
        active:
          type: integer
        delayed:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        paused:
          type: integer
      required:
        - name
        - wait
        - active
        - delayed
        - completed
        - failed
        - paused
    QueueDepths:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueCounts"
      required:
        - queues
    EventRow:
      type: object
      properties:
        id:
          type: string
        brandId:
          type: string
          nullable: true
        actorId:
          type: string
          nullable: true
        eventType:
          type: string
        subjectType:
          type: string
          nullable: true
        subjectId:
          type: string
          nullable: true
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - payload
        - createdAt
    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventRow"
      required:
        - events
    HeartbeatFreshness:
      type: object
      properties:
        lastEventAt:
          type: string
          format: date-time
          nullable: true
        ageSeconds:
          type: integer
          nullable: true
        payload:
          type: object
          additionalProperties: true
      required:
        - lastEventAt
        - ageSeconds
    DeadJobRow:
      type: object
      properties:
        id:
          type: string
        queueName:
          type: string
        jobName:
          type: string
        jobId:
          type: string
        payload:
          type: object
          additionalProperties: true
        failureReason:
          type: string
        attemptsMade:
          type: integer
        failedAt:
          type: string
          format: date-time
      required:
        - id
        - queueName
        - jobName
        - jobId
        - failureReason
        - attemptsMade
        - failedAt
    DeadJobList:
      type: object
      properties:
        deadJobs:
          type: array
          items:
            $ref: "#/components/schemas/DeadJobRow"
      required:
        - deadJobs
    QualityGateSubmitRequest:
      type: object
      properties:
        brandId:
          type: string
          format: uuid
        contentObjectId:
          type: string
          format: uuid
      required: [brandId, contentObjectId]
    QualityGateSubmitResult:
      type: object
      properties:
        qaRunId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
      required: [qaRunId, idempotencyKey]
    QualityGateDecideRequest:
      type: object
      properties:
        brandId:
          type: string
          format: uuid
        contentObjectId:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
      required: [brandId, contentObjectId, decision]
    QualityGateDecisionResult:
      type: object
      properties:
        status:
          type: string
      required: [status]
    QualityGateQueueItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, "null"]
        status:
          type: string
        word_count:
          type: [integer, "null"]
        updated_at:
          type: string
          format: date-time
        qa_run:
          oneOf:
            - type: "null"
            - type: object
              properties:
                id: { type: string, format: uuid }
                status: { type: string }
                started_at: { type: [string, "null"], format: date-time }
                finished_at: { type: [string, "null"], format: date-time }
              required: [id, status]
      required: [id, status, updated_at]
    QualityGateQueueList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityGateQueueItem"
      required: [items]
    QualityGateCheckResult:
      type: object
      properties:
        id: { type: string, format: uuid }
        qa_run_id: { type: string, format: uuid }
        check_key: { type: string }
        severity:
          type: string
          enum: [hard_fail, warn, info]
        passed:
          type: [boolean, "null"]
        threshold:
          type: [number, "null"]
        observed:
          type: [number, "null"]
        details:
          type: [object, "null"]
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      required: [id, qa_run_id, check_key, severity, created_at]
    QualityGateReviewDetailBody:
      type: object
      properties:
        contentObject:
          type: object
          additionalProperties: true
        qaRun:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: true
        checks:
          type: array
          items:
            $ref: "#/components/schemas/QualityGateCheckResult"
        signoffs:
          type: array
          items:
            type: object
            additionalProperties: true
        overrides:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [contentObject, checks, signoffs, overrides]
    QualityGateStartFromDraftRequest:
      type: object
      properties:
        brandId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
      required: [brandId, projectId]
    RecoveryBaseline:
      type: object
      properties:
        id: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        baselineDate: { type: string }
        methodology: { type: string }
        baselineGscClicksDaily: { type: [string, "null"] }
        baselineGa4SessionsDaily: { type: [string, "null"] }
        baselineAvgPosition: { type: string }
        baselineKeywordsInTop10: { type: integer }
        baselineKeywordsInTop3: { type: integer }
        recoveryThresholdPct: { type: string }
        recoveryConsecutiveDays: { type: integer }
        lockedAt: { type: string, format: date-time }
        lockedBy: { type: string, format: uuid }
        notes: { type: [string, "null"] }
      required:
        - id
        - brandId
        - baselineDate
        - methodology
        - baselineAvgPosition
        - baselineKeywordsInTop10
        - baselineKeywordsInTop3
        - recoveryThresholdPct
        - recoveryConsecutiveDays
        - lockedAt
        - lockedBy
    RecoverySnapshot:
      type: object
      properties:
        id: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        snapshotDate: { type: string }
        gscClicks30dAvg: { type: [string, "null"] }
        ga4Sessions30dAvg: { type: [string, "null"] }
        avgPosition30d: { type: string }
        keywordsInTop10: { type: integer }
        keywordsInTop3: { type: integer }
        gapToBaselineClicksPct: { type: [string, "null"] }
        gapToBaselinePosition: { type: [string, "null"] }
        gapToBaselineTop10Pct: { type: [string, "null"] }
        computedAt: { type: string, format: date-time }
      required:
        - id
        - brandId
        - snapshotDate
        - avgPosition30d
        - keywordsInTop10
        - keywordsInTop3
        - computedAt
    RecoveryInitiative:
      type: object
      properties:
        id: { type: string, format: uuid }
        brandId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        description: { type: [string, "null"] }
        expectedImpactPct: { type: [string, "null"] }
        expectedImpactClicks: { type: [integer, "null"] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        status: { type: string }
        actualImpactClicks14d: { type: [integer, "null"] }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - brandId
        - name
        - type
        - startedAt
        - status
        - createdBy
        - createdAt
        - updatedAt
    RecoveryProjection:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [projecting, recovered, gap_widening, no_data]
        slope: { type: number }
        intercept: { type: number }
        latestGapPct: { type: number }
        projectedRecoveryDate: { type: string, format: date-time }
        pointsUsed: { type: integer }
        reason: { type: string }
      required: [status]
    RecoveryOverviewBody:
      type: object
      properties:
        baseline:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RecoveryBaseline"
        current:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RecoverySnapshot"
        gapPct:
          type: [number, "null"]
        activeInitiatives:
          type: integer
        projection:
          $ref: "#/components/schemas/RecoveryProjection"
      required: [baseline, current, gapPct, activeInitiatives, projection]
    RecoverySnapshotList:
      type: object
      properties:
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/RecoverySnapshot"
      required: [snapshots]
    RecoveryInitiativeList:
      type: object
      properties:
        initiatives:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryInitiative"
      required: [initiatives]
    QualityGateStartFromDraftResult:
      type: object
      properties:
        contentObjectId: { type: string, format: uuid }
        source:
          type: string
          enum: [created, reused]
      required: [contentObjectId, source]
