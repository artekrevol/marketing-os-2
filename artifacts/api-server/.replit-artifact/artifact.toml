kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Build both the API server and the BullMQ worker for production.
args = ["sh", "-c", "pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/worker run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Shell wrapper starts the worker in the background and the API server
# in the foreground, forwarding signals to both so they shut down cleanly.
args = ["sh", "artifacts/api-server/start-production.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
